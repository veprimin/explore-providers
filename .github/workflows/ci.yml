name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what we develop against; 24 is what Cloudflare Workers Builds
        # currently provisions. Running both catches drift between them.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm clean-install

      # Fails if react-router (or any client-side router) is imported, and on
      # any type error or build failure.
      - name: Lint, typecheck and build
        run: npm run check

      # The Cloudflare deploy runs this. Building it here means a broken
      # deploy is caught in the PR rather than on Cloudflare.
      - name: Build Cloudflare worker
        run: npm run build:cf

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
